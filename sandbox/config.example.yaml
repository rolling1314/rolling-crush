# 沙箱服务配置
# 通过环境变量 SANDBOX_ENV 选择环境，默认 development

development:
  server:
    host: "0.0.0.0"
    port: 8888
    debug: true

  database:
    host: "127.0.0.1"
    port: 5432
    user: "crush"
    password: "123456"
    database: "crush"
    sslmode: "disable"

  sandbox:
    auto_cleanup: false
    session_timeout: 3600
    startup:
      command: "cd / && bash restart.sh"
      language: "bash"
      working_dir: "/"

production:
  server:
    host: "0.0.0.0"
    port: 8888
    debug: false

  database:
    host: "43.163.92.30"
    port: 5432
    user: "crush"
    password: "123456"
    database: "crush"
    sslmode: "disable"

  sandbox:
    auto_cleanup: false
    session_timeout: 7200
    startup:
      command: "cd / && bash restart.sh"
      language: "bash"
      working_dir: "/"
